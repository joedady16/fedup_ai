name: fedup-ai

# Persistent data lives in named volumes, not bind mounts.
#
# Docker Desktop on WSL2 has a startup race: after a host reboot, containers
# with a restart policy can come up before the WSL filesystem is available to
# Docker. A bind mount then silently resolves to an empty directory inside
# Docker's own VM, Postgres initdb's into it, and the real data on disk is
# quietly orphaned. Named volumes are managed by Docker and are not affected.
#
# Use `python -m scripts.backup` to get the data back out.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # read-only, safe as a bind
    ports:
      - "5434:5432"          # host:5434 — 5432/5433 already in use on this box
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads      # original files people upload
      - images:/app/generated     # pictures the AI makes
    ports:
      - "3080:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach host Ollama
    depends_on:
      db:
        condition: service_healthy

  # Optional: only starts with `docker compose --profile images up`
  comfyui:
    profiles: ["images"]
    build:
      context: ./comfy
    restart: unless-stopped
    volumes:
      # Read-only: the checkpoint is large and we never want it re-downloaded
      # into a phantom mount, but a stale empty mount here only breaks renders,
      # it cannot lose data.
      - ./comfy/models:/opt/ComfyUI/models:ro
      - comfy_output:/opt/ComfyUI/output
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  uploads:
  images:
  comfy_output:
