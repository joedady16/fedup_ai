name: fedup-ai

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"          # host:5434 — 5432/5433 already in use on this box
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
    volumes:
      - ./data/uploads:/app/uploads     # original files people upload
      - ./data/images:/app/generated    # pictures the AI makes
    ports:
      - "3080:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach host Ollama
    depends_on:
      db:
        condition: service_healthy

  # Optional: only starts with `docker compose --profile images up`
  comfyui:
    profiles: ["images"]
    build:
      context: ./comfy
    restart: unless-stopped
    volumes:
      - ./comfy/models:/opt/ComfyUI/models
      - ./data/comfy-output:/opt/ComfyUI/output
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
